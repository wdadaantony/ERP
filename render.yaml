services:
  - type: web
    name: erp-web
    runtime: python
    plan: starter
    buildCommand: bash build.sh
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi --log-file - --bind 0.0.0.0:$PORT
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: SECURE_SSL_REDIRECT
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"

  - type: worker
    name: erp-worker
    runtime: python
    plan: starter
    buildCommand: bash build.sh
    startCommand: python manage.py procesar_cola --continuo
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: erp-db
          property: connectionString
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"

databases:
  - name: erp-db
    plan: basic-256mb

